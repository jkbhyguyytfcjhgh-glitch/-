<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>طرق ومهارات الاتصال | ENG / HAMODEY</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
:root {
  --primary: #38bdf8;
  --bg-dark: #0f172a;
  --box-bg: #020617;
  --choice-bg: #1e293b;
  --correct: #16a34a;
  --wrong: #dc2626;
}

body {
  background: var(--bg-dark);
  color: #fff;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  margin: 0;
  padding: 10px;
  text-align: right;
}

#progress-wrapper {
  width: 100%;
  height: 8px;
  background: #334155;
  position: sticky;
  top: 0;
  z-index: 100;
  border-radius: 10px;
  margin-bottom: 20px;
}
#progress-bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, var(--primary), #818cf8);
  border-radius: 10px;
  transition: 0.4s;
}

.header { text-align: center; margin-bottom: 20px; }
.name {
  font-size: 28px;
  font-weight: bold;
  color: var(--primary);
  text-shadow: 0 0 15px var(--primary);
}

.salah-banner {
  background: linear-gradient(135deg, #1e3a5f, #0f2540);
  border: 1px solid #38bdf855;
  border-radius: 14px;
  padding: 14px 20px;
  margin: 0 auto 18px auto;
  max-width: 800px;
  text-align: center;
  font-size: 17px;
  color: #fbbf24;
  font-weight: bold;
  letter-spacing: 0.5px;
  box-shadow: 0 4px 20px rgba(56,189,248,0.15);
  animation: glow 3s ease-in-out infinite alternate;
}
@keyframes glow {
  from { box-shadow: 0 4px 15px rgba(251,191,36,0.1); }
  to   { box-shadow: 0 4px 25px rgba(251,191,36,0.35); }
}

.box {
  background: var(--box-bg);
  padding: 25px;
  border-radius: 18px;
  max-width: 800px;
  margin: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.question {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 18px;
  line-height: 2;
  color: #f1f5f9;
  direction: rtl;
}

.choice {
  background: var(--choice-bg);
  padding: 12px 16px;
  margin-bottom: 10px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
  border: 1px solid transparent;
  font-size: 16px;
  line-height: 1.9;
  direction: rtl;
  display: block;
}
.choice:hover { background: #334155; border-color: var(--primary); }

.correct { background: var(--correct) !important; animation: pulse 0.5s; }
.wrong   { background: var(--wrong)   !important; animation: shake 0.4s; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25%       { transform: translateX(-5px); }
  75%       { transform: translateX(5px); }
}

.result-screen { text-align: center; }
.result-score  { font-size: 40px; color: var(--primary); margin-bottom: 20px; }

.review-item {
  text-align: right;
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
  border-right: 5px solid var(--wrong);
}
.review-q { font-weight: bold; margin-bottom: 5px; line-height: 2; }
.review-a { font-size: 14px; line-height: 2; }

.btn {
  background: var(--primary);
  color: #000;
  border: none;
  padding: 12px 25px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  margin: 10px;
  transition: 0.3s;
}
.btn:hover { transform: scale(1.05); opacity: 0.9; }

footer { margin-top: 30px; text-align: center; color: #94a3b8; font-size: 14px; }
</style>

<div id="progress-wrapper"><div id="progress-bar"></div></div>

<div class="header">
  <div class="name">🔥 طرق ومهارات الاتصال 🔥</div>
  <div style="color:#94a3b8; margin-top:5px;">ENG / HAMODEY</div>
</div>

<div class="salah-banner">
  🌙 اللهم صلِّ وسلِّم وبارك على سيدنا محمد  🌙
</div>

<div class="box">
  <div id="setup-screen" class="result-screen">
    <h3>اختر ترتيب الأسئلة المفضل:</h3>
    <button class="btn" onclick="startQuiz('original')">الترتيب الأساسي</button>
    <button class="btn" onclick="startQuiz('shuffle')">ترتيب عشوائي 🔀</button>
  </div>
  <div id="quiz" style="display:none;"></div>
</div>

<footer>
  <div style="margin-bottom:10px;"></div>
  <p>© جميع الحقوق محفوظة لـ ENG/HAMODEY</p>
</footer>

<script>
const originalQuestions = [

{q:`1- ما هو العنصر الخامس في عملية الاتصال؟`,
 choices:[`أ - الوسيلة`,`ب - الرسالة`,`ج - المرسل`,`د - التغذية الراجعة`], correct:3},

{q:`2- ما هي الخاصية التي تعني أن الاتصال لا يمكن إلغاء آثاره بعد حدوثه؟`,
 choices:[`أ - الاتصال عملية مستمرة`,`ب - الاتصال غير قابل للتراجع`,`ج - الاتصال عملية تفاعلية`,`د - الاتصال عملية رمزية`], correct:1},

{q:`3- أي من الآتي يعتبر من خصائص الرسالة الناجحة؟`,
 choices:[`أ - غامضة`,`ب - طويلة ومملة`,`ج - واضحة وجلية`,`د - تحتوي على أخطاء إملائية`], correct:2},

{q:`4- ما الهدف الذي يتعلق بالحاجات العاطفية مثل الحب والاحترام؟`,
 choices:[`أ - الهدف الاقتصادي`,`ب - الهدف النفسي`,`ج - الهدف الاجتماعي`,`د - الهدف المعرفي`], correct:1},

{q:`5- ما المفهوم الذي يشير إلى إعادة إرسال الرسالة من المستقبل إلى المرسل؟`,
 choices:[`أ - الوسيلة`,`ب - التغذية الراجعة`,`ج - المرسل`,`د - المستقبل`], correct:1},

{q:`6- ما هي السمة التي تعني أن الاتصال يعتمد على الرموز والإشارات؟`,
 choices:[`أ - الاتصال عملية حتمية`,`ب - الاتصال عملية رمزية`,`ج - الاتصال عملية مستمرة`,`د - الاتصال عملية قصدية`], correct:1},

{q:`7- أي من الآتي يعتبر من أهداف الاتصال الاجتماعية؟`,
 choices:[`أ - تحقيق التعاون وتقوية الصلات`,`ب - إشباع الحاجات البيولوجية`,`ج - جمع المعلومات الاقتصادية`,`د - تحقيق الأمن والاستقرار`], correct:0},

{q:`8- ما هو العنصر الذي يعتبر "قلب عملية الاتصال"؟`,
 choices:[`أ - المرسل`,`ب - الرسالة`,`ج - الوسيلة`,`د - المستقبل`], correct:1},

{q:`9- ما هي الخاصية التي تعني أن الاتصال يمكن أن يكون مقصوداً أو غير مقصود؟`,
 choices:[`أ - الاتصال عملية متكاملة`,`ب - الاتصال عملية تفاعلية`,`ج - الاتصال عملية قصدية وغير قصدية`,`د - الاتصال عملية ديناميكية`], correct:2},

{q:`10- أي من الآتي يعتبر من أهداف الاتصال المعرفية؟`,
 choices:[`أ - تحقيق المطالب البيولوجية`,`ب - التعلم والاطلاع`,`ج - تلبية الحاجات العاطفية`,`د - بناء الثقة والاحترام`], correct:1},

{q:`11- أي من التالي يعتبر شكلاً من أشكال الاتصال الكتابي؟`,
 choices:[`أ - المحاضرات`,`ب - المقابلات الشخصية`,`ج - التقارير الرسمية`,`د - المكالمات الهاتفية`], correct:2},

{q:`12- الاتصال الذي يحدث بين شخصين أو مجموعة صغيرة بهدف تبادل الأفكار وبناء العلاقات يسمى:`,
 choices:[`أ - الاتصال الذاتي`,`ب - الاتصال الشخصي`,`ج - الاتصال الجماهيري`,`د - الاتصال غير الرسمي`], correct:1},

{q:`13- أي من الخيارات التالية يمثل خاصية "الإيجاز" (Conciseness) في الاتصال الفعال؟`,
 choices:[`أ - ذكر جميع التفاصيل الدقيقة والمملة`,`ب - إيصال الرسالة بأقل عدد ممكن من الكلمات دون التضحية بالمعنى`,`ج - استخدام مصطلحات علمية معقدة لإظهار الخبرة`,`د - تكرار الفكرة أكثر من مرة لضمان الفهم`], correct:1},

{q:`14- مصطلح "الترابط" (Coherence) في الرسالة يعني:`,
 choices:[`أ - أن تكون الرسالة مدعومة بالحقائق والأرقام`,`ب - أن تكون الأفكار مترابطة ومنسقة بشكل منطقي`,`ج - أن تكون الرسالة خالية من الأخطاء اللغوية`,`د - أن يكون المرسل مهتماً بلغة جسده`], correct:1},

{q:`15- أي من التالي يعتبر معوقاً متعلقاً بالمرسل في عملية الاتصال؟`,
 choices:[`أ - ضعف قنوات الاتصال التكنولوجية`,`ب - ارتفاع درجة حرارة المكان`,`ج - إصدار أحكام مسبقة تجاه المستقبل`,`د - احتواء الرسالة على أخطاء لغوية`], correct:2},

{q:`16- ما الفرق الجوهري بين "الاتصال" و"التواصل"؟`,
 choices:[`أ - الاتصال تفاعل والتواصل إرسال معلومات`,`ب - التواصل عملية تفاعل وتبادل، بينما الاتصال عملية إرسال واستقبال`,`ج - لا يوجد فرق، كلاهما يحمل نفس المعنى`,`د - الاتصال يعتمد على الحوار، بينما التواصل لا يشترط التفاعل`], correct:1},

{q:`17- أي من العبارات التالية تمثل تطبيقاً عملياً لخاصية "الملموسية" (Concreteness)؟`,
 choices:[`أ - "نحتاج لتحسين الخدمة في القريب العاجل"`,`ب - "أداء الفريق كان رائعاً هذا الأسبوع"`,`ج - "حققت المبيعات زيادة قدرها 10% هذا الشهر"`,`د - "يجب مراعاة الدقة في العمل مستقبلاً"`], correct:2},

{q:`18- التعاطف مع مشاعر الآخرين وفهمها والقدرة على إدارتها، هو تعريف لـ:`,
 choices:[`أ - الاستماع النشط`,`ب - الذكاء العاطفي`,`ج - لغة الجسد`,`د - التغذية العكسية`], correct:1},

{q:`19- أي من الخيارات التالية يمثل وسيلة اتصال غير لفظي؟`,
 choices:[`أ - رسالة بريد إلكتروني`,`ب - محاضرة جامعية`,`ج - رفع الحاجبين (تعابير الوجه)`,`د - منشور على وسائل التواصل الاجتماعي`], correct:2},

{q:`20- معنى خاصية "الصحة/الدقة" (Correctness) في الاتصال هو:`,
 choices:[`أ - أن تكون الرسالة مختصرة وموجزة`,`ب - أن تكون الرسالة شاملة وكاملة`,`ج - أن تكون المعلومات صحيحة وخالية من الأخطاء اللغوية والحقائقية`,`د - أن تكون الأفكار مرتبة في تسلسل منطقي`], correct:2},

{q:`21- ما العنصر الذي يعتبر "أساس عملية الاتصال" وتعتمد مصداقيته بشكل كبير على مصداقية مصدره؟`,
 choices:[`أ - الرسالة`,`ب - الوسيلة`,`ج - المرسل (المصدر)`,`د - المستقبل (المتلقي)`], correct:2},

{q:`22- أي من الخيارات التالية يعد أحد أهداف الاتصال التنظيمي التي تساعد في القضاء على "الجزر المنعزلة" داخل المؤسسة؟`,
 choices:[`أ - دعم اتخاذ القرار`,`ب - تبادل المعلومات والمعرفة`,`ج - توجيه الجهود والرقابة`,`د - إدارة التغير`], correct:1},

{q:`23- ما هو العنصر الأساسي في عملية الاتصال والذي يمثل "الإطار الزماني والمكاني والنفسي والاجتماعي" الذي يحدث فيه الاتصال؟`,
 choices:[`أ - الرسالة`,`ب - الوسيلة`,`ج - التغذية العكسية`,`د - السياق (البيئة)`], correct:3},

{q:`24- أي نوع من أنواع الاتصال التنظيمي يمثل تحدياً رئيسياً يتمثل في "تعرض المعلومات للتشويه كلما مرت بالمستويات الهرمية"؟`,
 choices:[`أ - الاتصال التصاعدي`,`ب - الاتصال الأفقي`,`ج - الاتصال التنازلي (الهابط)`,`د - الاتصال غير الرسمي`], correct:2},

{q:`25- أي العبارات التالية تصف بشكل صحيح أحد جوانب أهمية الاتصال التنظيمي؟`,
 choices:[`أ - يخلق بيئة من الغموض تقلل من المساءلة`,`ب - يزيد من فرص نشوب الصراعات بسبب تعدد الآراء`,`ج - يقلل من الشائعات من خلال سد الفجوات المعلوماتية`,`د - يعيق عملية الابتكار لأنه يفرض قيوداً على تبادل الأفكار`], correct:2},

{q:`26- عندما يقوم موظف بتقديم اقتراح تطويري أو شكوى لمديره المباشر، فإن هذا النوع من الاتصالات يسمى:`,
 choices:[`أ - اتصالاً تنازلياً`,`ب - اتصالاً أفقياً`,`ج - اتصالاً خارجياً`,`د - اتصالاً تصاعدياً (صاعداً)`], correct:3},

{q:`27- أي من بدائل الاتصال التالية يُصنف ضمن "الاتصال غير اللفظي"؟`,
 choices:[`أ - التقارير المكتوبة`,`ب - رسائل البريد الإلكتروني`,`ج - نبرة الصوت`,`د - الاجتماعات الدورية`], correct:2},

{q:`28- ما هو الهدف الرئيسي للاتصال الخارجي للمنظمة؟`,
 choices:[`أ - تنسيق الجهود بين الإدارات المختلفة`,`ب - بناء صورة ذهنية إيجابية وإدارة السمعة المؤسسية`,`ج - نقل السياسات والإجراءات من المستويات العليا للتنفيذية`,`د - تبادل الخبرات بين الزملاء في نفس المستوى الوظيفي`], correct:1},

{q:`29- أي من الخيارات التالية يمثل تصنيفاً للاتصال التنظيمي حسب "الوسيلة" (النمط)؟`,
 choices:[`أ - الاتصال الداخلي والخارجي`,`ب - الاتصال الرسمي وغير الرسمي`,`ج - الاتصال اللفظي وغير اللفظي`,`د - الاتصال التنازلي والتصاعدي والأفقي`], correct:2},

{q:`30- ما هي الخاصية التي تميز الاتصال الكتابي (مثل التقارير والمذكرات) عن الاتصال الشفهي؟`,
 choices:[`أ - السرعة في نقل المعلومات وإتاحة الفرصة للأسئلة الفورية`,`ب - الغنى بالعواطف والمشاعر`,`ج - الاعتماد على لغة الجسد والإيماءات`,`د - الدقة وإمكانية التوثيق ووضوح المسؤولية`], correct:3},

{q:`31- أي من الأبعاد التالية يُعتبر جزءاً من مفهوم "الفعالية التنظيمية"؟`,
 choices:[`أ - الربحية فقط`,`ب - تحقيق الأهداف والكفاءة والتكيف`,`ج - توسيع هيكل المنظمة`,`د - تقليل عدد الموظفين`], correct:1},

{q:`32- تشير "مواءمة الأهداف" (Goal Alignment) في سياق الاتصال التنظيمي إلى:`,
 choices:[`أ - تحقيق أهداف الإدارة العليا فقط`,`ب - فهم كل موظف لكيفية مساهمة دوره اليومي في تحقيق أهداف المنظمة الكبرى`,`ج - كتابة الأهداف بلغة معقدة لضمان جديتها`,`د - مقارنة أهداف المنظمة بأهداف المنافسين`], correct:1},

{q:`33- أي نوع من فرق العمل يعتمد بشكل كامل على الاتصال الفعال، ويجمع أعضاء من إدارات مختلفة للعمل على مشروع محدد؟`,
 choices:[`أ - اللجان الدائمة`,`ب - فرق العمل اليومية`,`ج - فرق العمل المشتركة (Task Forces)`,`د - مجالس الإدارة`], correct:2},

{q:`34- أي من العوامل التالية يُعتبر شرطاً أساسياً في بيئة الاتصال لتحفيز الإبداع والابتكار؟`,
 choices:[`أ - التشدد في تطبيق القواعد`,`ب - تدفق المعلومات الحرة`,`ج - التركيز على العمل الفردي`,`د - تقليل التواصل غير الرسمي`], correct:1},

{q:`35- عندما يشعر الموظف بأن الإدارة تهتم بمصلحته وتستمع لمخاوفه، فإن هذا يعكس بُعداً من أبعاد الثقة يسمى:`,
 choices:[`أ - الكفاءة`,`ب - النزاهة`,`ج - الإحسان`,`د - الخبرة`], correct:2},

{q:`36- ما هو الفرق بين الصراع البناء والصراع الهدام؟`,
 choices:[`أ - البناء يحدث بين الأفراد، والهدام يحدث بين الإدارات`,`ب - البناء يركز على الأفكار ويحسن الأداء، والهدام يتحول لصراع شخصي ويدمر الأداء`,`ج - البناء سهل الحل، والهدام مستحيل الحل`,`د - البناء ينتج عن سوء الفهم، والهدام ينتج عن ندرة الموارد`], correct:1},

{q:`37- أي من العوائق التالية يُصنف ضمن "العوائق الشخصية (الفردية)" للاتصال الفعال؟`,
 choices:[`أ - كثرة المستويات الإدارية`,`ب - ضعف البنية التحتية للإنترنت`,`ج - عدم الإصغاء الجيد`,`د - التخصص الدقيق بين الإدارات`], correct:2},

{q:`38- مصطلح "الترشيح" في الاتصال التنظيمي يعني:`,
 choices:[`أ - اختيار أفضل الموظفين للتواصل مع العملاء`,`ب - تشويه الرسالة نتيجة مرورها بالعديد من المستويات الإدارية`,`ج - استخدام أكثر من قناة اتصال لنفس الرسالة`,`د - عملية تدريب الموظفين على مهارات الاتصال`], correct:1},

{q:`39- أي من العوائق التالية يُعتبر مثالاً على "الضجيج الرقمي" (Digital Noise)؟`,
 choices:[`أ - انقطاع التيار الكهربائي`,`ب - صعوبة استخدام نظام بريد إلكتروني معقد`,`ج - كثرة رسائل البريد الإلكتروني والإشعارات التي تؤدي لتشتت الانتباه`,`د - اختلاف اللغة الأم بين المتصلين`], correct:2},

{q:`40- من الاستراتيجيات المستخدمة للتغلب على معوقات الاتصال التنظيمي؟`,
 choices:[`أ - عدم تفعيل نظام التغذية العكسية`,`ب - تبسيط اللغة واستخدام كلمات واضحة ومباشرة`,`ج - عدم تدريب الموظفين والقادة`,`د - سوء اختيار الوسيلة`], correct:1},

{q:`41- ما هو التعريف المناسب للاتصال الفعال؟`,
 choices:[`أ - هو الاتصال الذي يتم فقط داخل المؤسسة بين المدير والمرؤوسين`,`ب - هو الاتصال الذي يؤدي إلى خلق استجابة تجاه أهداف المؤسسة بأحسن الوسائل وأقل التكاليف`,`ج - هو الاتصال المكتوب الذي يتم بين المؤسسات المختلفة`,`د - هو الاتصال الشفهي الذي لا يحتاج إلى متابعة`], correct:1},

{q:`42- من مقومات الاتصال التنظيمي الفعال، ما الذي يجب أن يسأله المدير نفسه لتحديد الهدف من الاتصال؟`,

{q:`78- تكييف أسلوب الاتصال يعني:`,

{q:`79- أي من الخصائص التالية تعني أن الاستراتيجية يجب أن تتضمن مؤشرات أداء (KPIs) واضحة مثل عدد الشكاوى وسرعة الاستجابة؟`,
 choices:[`أ - المرونة والتكيف الديناميكي`,`ب - القابلية للقياس والتقييم (Measurability)`,`ج - التوافق مع الثقافة التنظيمية`,`د - الاستباقية`], correct:1},

{q:`80- تشويه الرسالة عبر المستويات الهرمية يمكن اكتشافه وعلاجه من خلال:`,
 choices:[`أ - تقليص عدد الكلمات في كل رسالة`,`ب - جعل التغذية الراجعة مطلوبة في كل مستوى إداري`,`ج - استخدام لغة جسد منفتحة فقط`,`د - التواصل في مكان هادئ فقط`], correct:1},

];

/* ===== منطق الكويز ===== */
let questions = [];
let index = 0;
let score = 0;
let locked = false;
let userHistory = [];
const quiz = document.getElementById("quiz");
const setupScreen = document.getElementById("setup-screen");
const progBar = document.getElementById("progress-bar");

function startQuiz(order) {
  if (order === 'shuffle') {
    questions = [...originalQuestions].sort(() => Math.random() - 0.5);
  } else {
    questions = [...originalQuestions];
  }
  setupScreen.style.display = "none";
  quiz.style.display = "block";
  showQuestion();
}

function showQuestion() {
  const progress = (index / questions.length) * 100;
  progBar.style.width = progress + "%";
  if (index >= questions.length) { finishQuiz(); return; }
  locked = false;
  const q = questions[index];
  quiz.innerHTML = `
    <div style="color:var(--primary); font-size:14px; margin-bottom:10px;">سؤال ${index+1} من ${questions.length}</div>
    <div class="question">${q.q}</div>
    ${q.choices.map((c,i) => `<div class="choice" onclick="answer(this,${i})">${c}</div>`).join("")}
  `;
}

function answer(el, i) {
  if (locked) return;
  locked = true;
  const q = questions[index];
  userHistory.push({
    question: q.q,
    userAnswer: q.choices[i],
    correctAnswer: q.choices[q.correct],
    isCorrect: i === q.correct
  });
  if (i === q.correct) {
    el.classList.add("correct");
    score++;
  } else {
    el.classList.add("wrong");
    if (navigator.vibrate) navigator.vibrate(200);
    document.querySelectorAll(".choice")[q.correct].classList.add("correct");
  }
  setTimeout(() => { index++; showQuestion(); }, 1200);
}

function finishQuiz() {
  progBar.style.width = "100%";
  const percent = Math.round((score / questions.length) * 100);
  if (percent >= 50) confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
  quiz.innerHTML = `
    <div class="result-screen">
      <div class="result-score">${score} / ${questions.length}</div>
      <h3>${percent >= 50 ? "أحسنت يا بشمهندس! 🎉" : "حاول مرة أخرى! 💪"}</h3>
      <p>نسبة النجاح: ${percent}%</p>
      <button class="btn" onclick="location.reload()">إعادة الاختبار</button>
      <button class="btn" style="background:#fff" onclick="showReview()">مراجعة الأخطاء فقط 🧐</button>
    </div>
  `;
}

function showReview() {
  const errors = userHistory.filter(item => !item.isCorrect);
  let reviewHTML = `<h3 style="color:var(--primary)">الأخطاء التي وقعت فيها (${errors.length}):</h3>`;
  if (errors.length === 0) {
    reviewHTML += `<p>ممتاز! لا توجد أخطاء لمراجعتها.</p>`;
  } else {
    errors.forEach(item => {
      reviewHTML += `
        <div class="review-item">
          <div class="review-q">${item.question}</div>
          <div class="review-a">
            إجابتك: <span style="color:var(--wrong)">${item.userAnswer}</span><br><br>
            الإجابة الصحيحة: <span style="color:var(--correct)">${item.correctAnswer}</span>
          </div>
        </div>`;
    });
  }
  reviewHTML += `<button class="btn" onclick="location.reload()">العودة للرئيسية</button>`;
  quiz.innerHTML = reviewHTML;
  window.scrollTo(0, 0);
}
</script>
