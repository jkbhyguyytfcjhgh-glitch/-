<style>
:root {
  --primary: #38bdf8;
  --bg-dark: #0f172a;
  --box-bg: #020617;
  --choice-bg: #1e293b;
  --correct: #16a34a;
  --wrong: #dc2626;
}

body {
  background: var(--bg-dark);
  color: #fff;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  margin: 0;
  padding: 10px;
  text-align: right;
}

#progress-wrapper {
  width: 100%;
  height: 8px;
  background: #334155;
  position: sticky;
  top: 0;
  z-index: 100;
  border-radius: 10px;
  margin-bottom: 20px;
}
#progress-bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, var(--primary), #818cf8);
  border-radius: 10px;
  transition: 0.4s;
}

.header { text-align: center; margin-bottom: 20px; }
.name {
  font-size: 28px;
  font-weight: bold;
  color: var(--primary);
  text-shadow: 0 0 15px var(--primary);
}

.salah-banner {
  background: linear-gradient(135deg, #1e3a5f, #0f2540);
  border: 1px solid #38bdf855;
  border-radius: 14px;
  padding: 14px 20px;
  margin: 0 auto 18px auto;
  max-width: 800px;
  text-align: center;
  font-size: 17px;
  color: #fbbf24;
  font-weight: bold;
  letter-spacing: 0.5px;
  box-shadow: 0 4px 20px rgba(56,189,248,0.15);
  animation: glow 3s ease-in-out infinite alternate;
}
@keyframes glow {
  from { box-shadow: 0 4px 15px rgba(251,191,36,0.1); }
  to   { box-shadow: 0 4px 25px rgba(251,191,36,0.35); }
}

.box {
  background: var(--box-bg);
  padding: 25px;
  border-radius: 18px;
  max-width: 800px;
  margin: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.question {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 18px;
  line-height: 2;
  color: #f1f5f9;
  direction: rtl;
}

.choice {
  background: var(--choice-bg);
  padding: 12px 16px;
  margin-bottom: 10px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
  border: 1px solid transparent;
  font-size: 16px;
  line-height: 1.9;
  direction: rtl;
  display: block;
}
.choice:hover { background: #334155; border-color: var(--primary); }

.correct { background: var(--correct) !important; animation: pulse 0.5s; }
.wrong   { background: var(--wrong)   !important; animation: shake 0.4s; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25%       { transform: translateX(-5px); }
  75%       { transform: translateX(5px); }
}

.result-screen { text-align: center; }
.result-score  { font-size: 40px; color: var(--primary); margin-bottom: 20px; }

.review-item {
  text-align: right;
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
  border-right: 5px solid var(--wrong);
}
.review-q { font-weight: bold; margin-bottom: 5px; line-height: 2; }
.review-a { font-size: 14px; line-height: 2; }

.btn {
  background: var(--primary);
  color: #000;
  border: none;
  padding: 12px 25px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  margin: 10px;
  transition: 0.3s;
}
.btn:hover { transform: scale(1.05); opacity: 0.9; }

footer { margin-top: 30px; text-align: center; color: #94a3b8; font-size: 14px; }
.social-icons { display: flex; justify-content: center; gap: 16px; margin-bottom: 12px; }
.social-icons a {
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: 50%;

.social-icons a:hover { transform: scale(1.15); }
.social-icons a.whatsapp { background: #25d366; box-shadow: 0 0 12px #25d36655; }
.social-icons a.instagram { background: radial-gradient(circle at 30% 110%, #f09433, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888); box-shadow: 0 0 12px #dc274355; }
.social-icons svg { width: 24px; height: 24px; fill: #fff; }

/* ===== منطق الكويز ===== */
let questions = [];
let index = 0;
let score = 0;
let locked = false;
let userHistory = [];
const quiz = document.getElementById("quiz");
const setupScreen = document.getElementById("setup-screen");
const progBar = document.getElementById("progress-bar");

function startQuiz(order) {
  if (order === 'shuffle') {
    questions = [...originalQuestions].sort(() => Math.random() - 0.5);
  } else {
    questions = [...originalQuestions];
  }
  setupScreen.style.display = "none";
  quiz.style.display = "block";
  showQuestion();
}

function showQuestion() {
  const progress = (index / questions.length) * 100;
  progBar.style.width = progress + "%";
  if (index >= questions.length) { finishQuiz(); return; }
  locked = false;
  const q = questions[index];
  quiz.innerHTML = `
    <div style="color:var(--primary); font-size:14px; margin-bottom:10px;">سؤال ${index+1} من ${questions.length}</div>
    <div class="question">${q.q}</div>
    ${q.choices.map((c,i) => `<div class="choice" onclick="answer(this,${i})">${c}</div>`).join("")}
  `;
}

function answer(el, i) {
  if (locked) return;
  locked = true;
  const q = questions[index];
  userHistory.push({
    question: q.q,
    userAnswer: q.choices[i],
    correctAnswer: q.choices[q.correct],
    isCorrect: i === q.correct
  });
  if (i === q.correct) {
    el.classList.add("correct");
    score++;
  } else {
    el.classList.add("wrong");
    if (navigator.vibrate) navigator.vibrate(200);
    document.querySelectorAll(".choice")[q.correct].classList.add("correct");
  }
  setTimeout(() => { index++; showQuestion(); }, 1200);
}

function finishQuiz() {
  progBar.style.width = "100%";
  const percent = Math.round((score / questions.length) * 100);
  if (percent >= 50) confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
  quiz.innerHTML = `
    <div class="result-screen">
      <div class="result-score">${score} / ${questions.length}</div>
      <h3>${percent >= 50 ? "أحسنت يا بشمهندس! 🎉" : "حاول مرة أخرى! 💪"}</h3>
      <p>نسبة النجاح: ${percent}%</p>
      <button class="btn" onclick="location.reload()">إعادة الاختبار</button>
      <button class="btn" style="background:#fff" onclick="showReview()">مراجعة الأخطاء فقط 🧐</button>
    </div>
  `;
}

function showReview() {
  const errors = userHistory.filter(item => !item.isCorrect);
  let reviewHTML = `<h3 style="color:var(--primary)">الأخطاء التي وقعت فيها (${errors.length}):</h3>`;
  if (errors.length === 0) {
    reviewHTML += `<p>ممتاز! لا توجد أخطاء لمراجعتها.</p>`;
  } else {
    errors.forEach(item => {
      reviewHTML += `
        <div class="review-item">
          <div class="review-q">${item.question}</div>
          <div class="review-a">
            إجابتك: <span style="color:var(--wrong)">${item.userAnswer}</span><br><br>
            الإجابة الصحيحة: <span style="color:var(--correct)">${item.correctAnswer}</span>
          </div>
        </div>`;
    });
  }
  reviewHTML += `<button class="btn" onclick="location.reload()">العودة للرئيسية</button>`;
  quiz.innerHTML = reviewHTML;
  window.scrollTo(0, 0);
}
</script>
