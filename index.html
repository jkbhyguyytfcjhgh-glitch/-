<style>

    }
    @keyframes gradientBG {
        0%{background-position:0% 50%;}
        50%{background-position:100% 50%;}
        100%{background-position:0% 50%;}
    }

    .container {
        max-width:750px; width:100%;
        background: var(--card-bg);
        border-radius:20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        padding:25px;
        z-index:1;
        position: relative;
    }

    h1.title {
        color: var(--primary-gold);
        text-align:center;
        margin-bottom:10px;
        text-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
    }

    #mode-selection {
        display: flex; flex-direction: column; gap: 15px; margin-top: 20px;
    }

    .mode-card {
        background: rgba(255,255,255,0.05);
        padding: 20px; border-radius: 12px; border: 1px solid #444;
        cursor: pointer; transition: 0.3s; text-align: center;
    }
    .mode-card:hover { background: rgba(241, 196, 15, 0.15); border-color: var(--primary-gold); }
    .mode-card h3 { margin: 0; color: var(--primary-gold); }

    .progress-container {
        width: 100%; background: #333; border-radius: 10px; height: 10px; margin: 20px 0; display: none;
    }
    .progress-bar {
        height: 100%; background: var(--primary-gold); width: 0%; border-radius: 10px; transition: 0.3s;
    }

    .question-box {
        font-size:1.3rem; font-weight:600; margin:20px 0; line-height: 1.6;
        background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px;
        border-right: 5px solid var(--primary-gold); display: none;
    }

    .answers { display:none; flex-direction:column; gap:15px; }

    button.answer-btn, .nav-btn, .retry-btn {
        font-size:1.1rem; padding:15px; border:2px solid #555; border-radius:12px;
        background:#1c1c1c; color:#ecf0f1; cursor:pointer; transition: 0.2s; text-align:right;
    }
    button.answer-btn:hover { background:#333; border-color: var(--primary-gold); }
    button.answer-btn.correct { background: var(--correct-green) !important; color: #000; font-weight: bold; }
    button.answer-btn.incorrect { background: var(--wrong-red) !important; color: #fff; }

    .nav-btn { background: var(--primary-gold); color: #000; font-weight: bold; border: none; margin-top: 15px; width: 100%; text-align: center;}
    .nav-btn:hover { opacity: 0.9; transform: scale(1.02); }

    .result-screen { text-align:center; display:none; }
    .score-text { font-size: 2rem; color: var(--primary-gold); margin-bottom: 20px; }

    .wrong-item {
        background: rgba(231, 76, 60, 0.1); border-right: 4px solid var(--wrong-red);
        padding: 15px; margin-bottom: 10px; text-align: right; border-radius: 8px;
    }
    .wrong-item span { color: var(--correct-green); font-weight: bold; }

    footer { margin-top:30px; text-align:center; font-size:0.9rem; }
    .links { display:flex; justify-content:center; gap:20px; margin-top:10px; }
 .links a { color: var(--primary-gold); text-decoration:none; font-weight:bold; }

let currentQuestions = [];
let quizMode = '';

function initQuiz(mode) {
    quizMode = mode;
    document.getElementById('mode-selection').style.display = 'none';
    document.getElementById('order-selection').style.display = 'block';
}

function startQuiz(orderType) {
    if (quizMode === 'p1') {
        currentQuestions = allQuestions.slice(0, 32);
    } else if (quizMode === 'p2') {
        currentQuestions = allQuestions.slice(32);
    } else {
        currentQuestions = [...allQuestions];
    }

    if (orderType === 'random') {
        currentQuestions.sort(() => Math.random() - 0.5);
    }

    document.getElementById('order-selection').style.display = 'none';
    document.getElementById('progCont').style.display = 'block';
    document.getElementById('qBox').style.display = 'block';
    document.getElementById('aBox').style.display = 'flex';

    renderQuestion();
}

    if (currentIndex >= currentQuestions.length) {
        showResults();
        return;
    }

    const q = currentQuestions[currentIndex];
    document.getElementById('qBox').innerHTML = q.question;

    const percent = (currentIndex / currentQuestions.length) * 100;
    document.getElementById('progBar').style.width = percent + '%';

    const aBox = document.getElementById('aBox');
    aBox.innerHTML = '';

    ['صح', 'خطأ'].forEach((text, i) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = text;
        btn.onclick = () => checkAnswer(i === 0, q, btn);
        aBox.appendChild(btn);
    });
}

function checkAnswer(userAns, qObj, btn) {
    const allBtns = document.querySelectorAll('.answer-btn');
    allBtns.forEach(b => b.disabled = true);

    if (userAns === qObj.correct) {
        btn.classList.add('correct');
        score++;
    } else {
        btn.classList.add('incorrect');
        missed.push({ q: qObj.question, a: qObj.correct ? 'صح' : 'خطأ' });
    }

    setTimeout(() => {
        currentIndex++;
        renderQuestion();
    }, 600);
}

function showResults() {
    document.getElementById('progCont').style.display = 'none';
    document.getElementById('qBox').style.display = 'none';
    document.getElementById('aBox').style.display = 'none';

    const resScreen = document.getElementById('resScreen');
    resScreen.style.display = 'block';

    document.getElementById('scoreText').textContent = `نتيجتك: ${score} من ${currentQuestions.length}`;

    const wrongList = document.getElementById('wrongList');
    wrongList.innerHTML = missed.length > 0 ? '<h3>❌ الأسئلة التي أخطأت فيها:</h3>' : '<h3 style="color:var(--correct-green)">🌟 ممتاز! لا توجد أخطاء.</h3>';

    missed.forEach(item => {
        const div = document.createElement('div');
        div.className = 'wrong-item';
        div.innerHTML = `❓ ${item.q} <br> ✅ الإجابة الصحيحة هي: <span>${item.a}</span>`;
        wrongList.appendChild(div);
    });

    const nav = document.getElementById('navButtons');
    nav.innerHTML = '';

    if (quizMode === 'p1') {
        const nextBtn = document.createElement('button');
        nextBtn.className = 'nav-btn';
        nextBtn.textContent = '➡️ انتقل لإمتحان الجزء الثاني';
        nextBtn.onclick = () => { resetVars(); initQuiz('p2'); };
        nav.appendChild(nextBtn);
    }

    const homeBtn = document.createElement('button');
    homeBtn.className = 'nav-btn';
    homeBtn.style.background = '#555';
    homeBtn.style.color = '#fff';
    homeBtn.textContent = '🔄 العودة للقائمة الرئيسية';
    homeBtn.onclick = () => location.reload();
    nav.appendChild(homeBtn);
}

function resetVars() {
    currentIndex = 0;
    score = 0;
    missed = [];
    document.getElementById('resScreen').style.display = 'none';
}
</script>

</body>
</html>
