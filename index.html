<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إمتحان رياضة الأعمال - ENG/HAMODEY</title>
<style>
    :root {
        --primary-gold: #f1c40f;
        --dark-bg: #0f2027;
        --card-bg: rgba(30, 30, 30, 0.95);
        --correct-green: #2ecc71;
        --wrong-red: #e74c3c;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin:0; padding:20px;
        display:flex; flex-direction:column; align-items:center;
        min-height:100vh;
        background: linear-gradient(270deg, #0f2027, #203a43, #2c5364);
        background-size:400% 400%;
        animation: gradientBG 15s ease infinite;
        color:#ecf0f1;
    }
    @keyframes gradientBG {
        0%{background-position:0% 50%;}
        50%{background-position:100% 50%;}
        100%{background-position:0% 50%;}
    }

    .container {
        max-width:750px; width:100%;
        background: var(--card-bg);
        border-radius:20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        padding:25px;
        z-index:1;
        position: relative;
    }

    h1.title {
        color: var(--primary-gold);
        text-align:center;
        margin-bottom:10px;
        text-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
    }

    #mode-selection {
        display: flex; flex-direction: column; gap: 15px; margin-top: 20px;
    }

    .mode-card {
        background: rgba(255,255,255,0.05);
        padding: 20px; border-radius: 12px; border: 1px solid #444;
        cursor: pointer; transition: 0.3s; text-align: center;
    }
    .mode-card:hover { background: rgba(241, 196, 15, 0.15); border-color: var(--primary-gold); }
    .mode-card h3 { margin: 0; color: var(--primary-gold); }

    .progress-container {
        width: 100%; background: #333; border-radius: 10px; height: 10px; margin: 20px 0; display: none;
    }
    .progress-bar {
        height: 100%; background: var(--primary-gold); width: 0%; border-radius: 10px; transition: 0.3s;
    }

    .question-box {
        font-size:1.3rem; font-weight:600; margin:20px 0; line-height: 1.6;
        background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px;
        border-right: 5px solid var(--primary-gold); display: none;
    }

    .answers { display:none; flex-direction:column; gap:15px; }

    button.answer-btn, .nav-btn, .retry-btn {
        font-size:1.1rem; padding:15px; border:2px solid #555; border-radius:12px;
        background:#1c1c1c; color:#ecf0f1; cursor:pointer; transition: 0.2s; text-align:right;
    }
    button.answer-btn:hover { background:#333; border-color: var(--primary-gold); }
    button.answer-btn.correct { background: var(--correct-green) !important; color: #000; font-weight: bold; }
    button.answer-btn.incorrect { background: var(--wrong-red) !important; color: #fff; }

    .nav-btn { background: var(--primary-gold); color: #000; font-weight: bold; border: none; margin-top: 15px; width: 100%; text-align: center;}
    .nav-btn:hover { opacity: 0.9; transform: scale(1.02); }

    .result-screen { text-align:center; display:none; }
    .score-text { font-size: 2rem; color: var(--primary-gold); margin-bottom: 20px; }

    .wrong-item {
        background: rgba(231, 76, 60, 0.1); border-right: 4px solid var(--wrong-red);
        padding: 15px; margin-bottom: 10px; text-align: right; border-radius: 8px;
    }
    .wrong-item span { color: var(--correct-green); font-weight: bold; }

    .frac {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        line-height: 1;
        vertical-align: middle;
        margin: 0 0.1em;
    }
    .frac .num, .frac .den { padding: 0 0.15em; }
    .frac .bar { width: 100%; height: 1px; background: currentColor; margin: 1px 0; }

    /* Matrix Box */
    .matrix-box {
        display: none;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        padding: 15px 10px;
        margin-bottom: 15px;
        direction: ltr;
        overflow-x: auto;
    }

    .matrices-section {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
        margin-bottom: 12px;
    }

    .matrix-item {
        display: flex;
        align-items: center;
        gap: 4px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.95rem;
    }

    .mat-name {
        color: #f1c40f;
        font-weight: bold;
        font-size: 1rem;
        margin-left: 4px;
        align-self: center;
    }

    .mat-bracket {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .mat-bracket-left {
        border-left: 2px solid #ecf0f1;
        border-top: 2px solid #ecf0f1;
        border-bottom: 2px solid #ecf0f1;
        padding: 2px 3px 2px 4px;
        border-radius: 3px 0 0 3px;
    }

    .mat-bracket-right {
        border-right: 2px solid #ecf0f1;
        border-top: 2px solid #ecf0f1;
        border-bottom: 2px solid #ecf0f1;
        padding: 2px 4px 2px 3px;
        border-radius: 0 3px 3px 0;
    }

    .mat-rows {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 2px 0;
    }

    .mat-row {
        display: flex;
        gap: 10px;
        justify-content: center;
    }

    .mat-cell {
        min-width: 22px;
        text-align: right;
        color: #ecf0f1;
        font-size: 0.9rem;
    }

    footer { margin-top:30px; text-align:center; font-size:0.9rem; }
    .links { display:flex; justify-content:center; gap:20px; margin-top:10px; }
    .links a { color: var(--primary-gold); text-decoration:none; font-weight:bold; }
</style>
</head>
<body>

    <div id="mode-selection">

<script>

function buildMatrix(name, rows) {
    const rowsHTML = rows.map(r =>
        `<div class="mat-row">${r.map(v => `<span class="mat-cell">${v}</span>`).join('')}</div>`
    ).join('');
    return `
    <div class="matrix-item">
        <span class="mat-name">${name} =</span>
        <div class="mat-bracket mat-bracket-left"></div>
        <div class="mat-rows">${rowsHTML}</div>
        <div class="mat-bracket mat-bracket-right"></div>
    </div>`;
}

function buildMatricesHTML(groups) {
    return groups.map(group =>
        `<div class="matrices-section">${group.map(m => buildMatrix(m.name, m.rows)).join('')}</div>`
    ).join('');
}

const allQuestions = [

  { question: "إذا كانت f(x) = a + a²x فإن الدالة f(x) دالة من الدرجة الثانية في x", correct: false },

  { question: "إذا كانت f(x) = 1/(x+1) فإن نهاية الدالة معرفة عند النقطة 0", correct: true },
  { question: "إذا كانت f(x) = 1/(x+1) فإن نهاية الدالة غير معرفة عند النقطة −1", correct: true },
  { question: "إذا كانت f(x) = x² فإن f(x) تمثل بخط مستقيم", correct: false },
  { question: "إذا كانت f(x) = x + 2 فإن f(x) تمثل بخط مستقيم", correct: true },
  { question: "إذا كانت f(x) = e⁻ˣ فإن f(x) عندما تؤول x إلى −1 تساوي 0", correct: false },

  { question: "إذا كانت f(x) = x + 2 فإن f(x) مستمرة دائماً", correct: true },

  { question: "إذا كانت <br> u = 2x³ + 3 ، y = u³ + u² <br>فإن <br>y' = (3u² + 2u)", correct: true },
  { question: "المشتقة الأولى للدالة f(x) = 2x + 3 هي 2", correct: true },
  { question: "هذه الدالة f(x) = 2x + 3 دائماً متناقصة", correct: false },
  { question: "لا يوجد لهذه الدالة f(x) = 2x + 3 نقاط عظمى وصغرى", correct: true },

 
  { question: "إذا كانت <br> u = 2x+3 ، v = 4−x² ، y = u⁶ + v⁵<br> فإن <br> y∂/u∂ = 6u⁵", correct: true },

  { question: "إذا كانت f(x) = x² + 2 فإن  <br>f(x)dx = (1/3)x³ + 2x + k∫", correct: true },

  { question: "الدالة x(x²+1)⁴ يتم تكاملها بالتعويض", correct: true},

  { question: "عمليه A × B ممكنة", correct: true, matrices: matricesApp10 },

  { question: "أبعاد المصفوفة B هي D(B) = 2×3", correct: true, matrices: matricesApp10 },

  { question: "إذا كانت أبعاد المصفوفة m×n وكانت n=1 فإن المصفوفة تسمى مصفوفة رأسي", correct: false,},
  { question: "عملية C × D ممكنة", correct: true, matrices: matricesApp10 },
  { question: "عملية D × C ممكنة", correct: false, matrices: matricesApp10 },
  { question: "إذا كان CA = BA فإن C = B", correct: false, },
 { 
  question: "إذا كانت A فإن |A| = -8", 
  correct: false, 
  matrices: buildMatricesHTML([[{ name: 'A', rows: [[5,2],[1,-1]] }]])
},
  { question: "عملية الضرب عملية إبدالية في المصفوفات", correct: false,  },
  { question: "الدوال كثيرة الحدود متصلة دائماً", correct: true },
  { question: "إذا كانت f(x) = (ln5x) + 1 فإن f'(x) = 1/(5x)", correct: false },

];
let currentQuestions = [];
let quizMode = '';
let currentIndex = 0;
let score = 0;
let missed = [];

function initQuiz(mode) {
    quizMode = mode;
    document.getElementById('mode-selection').style.display = 'none';
    document.getElementById('order-selection').style.display = 'block';
}

function startQuiz(orderType) {
    if (quizMode === 'p1') {
        currentQuestions = allQuestions.slice(0, 25);
    } else if (quizMode === 'p2') {
        currentQuestions = allQuestions.slice(25);
    } else {
        currentQuestions = [...allQuestions];
    }

    if (orderType === 'random') {
        currentQuestions.sort(() => Math.random() - 0.5);
    }

    document.getElementById('order-selection').style.display = 'none';
    document.getElementById('progCont').style.display = 'block';
    document.getElementById('qBox').style.display = 'block';
    document.getElementById('aBox').style.display = 'flex';

    renderQuestion();
}

function formatQuestionText(text) {
    return text.replace(/(\([^)]*\)|[^\s\/()]+)\/(\([^)]*\)|[^\s\/()]+)/g, (match, num, den) => {
        return `<span class="frac"><span class="num">${num}</span><span class="bar"></span><span class="den">${den}</span></span>`;
    });
}

function renderQuestion() {
    if (currentIndex >= currentQuestions.length) {
        showResults();
        return;
    }

    const q = currentQuestions[currentIndex];
    document.getElementById('qBox').innerHTML = formatQuestionText(q.question);

    const matrixBox = document.getElementById('matrixBox');
    if (q.matrices) {
        matrixBox.style.display = 'block';
        matrixBox.innerHTML = q.matrices;
    } else {
        matrixBox.style.display = 'none';
        matrixBox.innerHTML = '';
    }

    const percent = (currentIndex / currentQuestions.length) * 100;
    document.getElementById('progBar').style.width = percent + '%';

    const aBox = document.getElementById('aBox');
    aBox.innerHTML = '';

    ['صح', 'خطأ'].forEach((text, i) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = text;
        btn.onclick = () => checkAnswer(i === 0, q, btn);
        aBox.appendChild(btn);
    });
}

function checkAnswer(userAns, qObj, btn) {
    const allBtns = document.querySelectorAll('.answer-btn');
    allBtns.forEach(b => b.disabled = true);

    if (userAns === qObj.correct) {
        btn.classList.add('correct');
        score++;
    } else {
        btn.classList.add('incorrect');
        missed.push({ q: qObj.question, a: qObj.correct ? 'صح' : 'خطأ' });
    }

    setTimeout(() => {
        currentIndex++;
        renderQuestion();
    }, 600);
}

function showResults() {
    document.getElementById('progCont').style.display = 'none';
    document.getElementById('qBox').style.display = 'none';
    document.getElementById('aBox').style.display = 'none';

    const resScreen = document.getElementById('resScreen');
    resScreen.style.display = 'block';

    document.getElementById('scoreText').textContent = `نتيجتك: ${score} من ${currentQuestions.length}`;

    const wrongList = document.getElementById('wrongList');
    wrongList.innerHTML = missed.length > 0 ? '<h3>❌ الأسئلة التي أخطأت فيها:</h3>' : '<h3 style="color:var(--correct-green)">🌟 ممتاز! لا توجد أخطاء.</h3>';

    missed.forEach(item => {
        const div = document.createElement('div');
        div.className = 'wrong-item';
        div.innerHTML = `❓ ${item.q} <br> ✅ الإجابة الصحيحة هي: <span>${item.a}</span>`;
        wrongList.appendChild(div);
    });

    const nav = document.getElementById('navButtons');
    nav.innerHTML = '';

    if (quizMode === 'p1') {
        const nextBtn = document.createElement('button');
        nextBtn.className = 'nav-btn';
        nextBtn.textContent = '➡️ انتقل لإمتحان الجزء الثاني';
        nextBtn.onclick = () => { resetVars(); initQuiz('p2'); };
        nav.appendChild(nextBtn);
    }

    const homeBtn = document.createElement('button');
    homeBtn.className = 'nav-btn';
    homeBtn.style.background = '#555';
    homeBtn.style.color = '#fff';
    homeBtn.textContent = '🔄 العودة للقائمة الرئيسية';
    homeBtn.onclick = () => location.reload();
    nav.appendChild(homeBtn);
}

function resetVars() {
    currentIndex = 0;
    score = 0;
    missed = [];
    document.getElementById('resScreen').style.display = 'none';
}
</script>

</body>
</html>
